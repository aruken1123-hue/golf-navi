<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#111111">
  <title>コース登録 - ゴルフナビ</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="vendor/leaflet/leaflet.css">
  <link rel="stylesheet" href="css/style.css">
  <style>
    .ed-bar { display: flex; flex-wrap: wrap; gap: 6px; padding: 6px 8px; background: var(--panel); border-bottom: 1px solid var(--line); align-items: center; }
    .ed-bar select, .ed-bar input { padding: 6px; }
    .ed-bar input[type=number] { width: 64px; }
    .ed-bar .hole-nav { display: flex; gap: 4px; align-items: center; }
    .ed-bar .hole-step { padding: 6px 10px; min-height: 34px; font-size: 15px; }
    .ed-bar a { color: var(--sub); margin-left: auto; }
    .ed-panel { background: var(--panel); border-top: 1px solid var(--line); padding: 8px; max-height: 46vh; overflow-y: auto; }
    .tools { display: grid; grid-template-columns: repeat(auto-fill, minmax(112px, 1fr)); gap: 6px; }
    .tools button { font-size: 14px; padding: 8px 4px; }
    .hz-opts { display: flex; gap: 6px; margin: 8px 0; flex-wrap: wrap; }
    .hz-opts input { flex: 1; min-width: 120px; }
    .hint { color: #ffd60a; font-size: 14px; margin: 6px 0; min-height: 1.4em; }
    .items { list-style: none; padding: 0; margin: 6px 0; font-size: 14px; }
    .items li { display: flex; justify-content: space-between; align-items: center; gap: 8px; padding: 4px 0; border-top: 1px solid var(--line); }
    .items button { padding: 2px 10px; font-size: 13px; }
    .files { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; }
    .gps-rec { border: 1px solid var(--accent); border-radius: 10px; padding: 8px; margin-top: 8px; }
    .adj { border: 1px solid #ffd60a; border-radius: 10px; padding: 8px; margin: 8px 0; }
    .adj-title { font-weight: 700; font-size: 14px; margin-bottom: 6px; }
    .adj-body { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
    .adj-pad { display: grid; grid-template-columns: repeat(3, 44px); grid-template-rows: repeat(3, 40px); gap: 4px; }
    .adj-pad button { font-size: 20px; padding: 0; }
    .adj-pad .adj-c { display: flex; align-items: center; justify-content: center; font-size: 11px; color: var(--sub); }
    .adj-side { display: flex; flex-direction: column; gap: 8px; font-size: 14px; }
    .adj-rot { display: flex; gap: 6px; align-items: center; }
    .adj-rot button { font-size: 22px; min-width: 48px; padding: 2px 8px; }
    .adj-rot.off { opacity: .35; pointer-events: none; }
    .items-head { display: flex; justify-content: flex-end; margin-top: 6px; }
    .items-head button { font-size: 13px; padding: 4px 10px; }
    .items li.item { cursor: pointer; }
    .items li.item:active, .items li.item:hover { background: #24384a; }
    .items li .chev { color: var(--sub); flex: none; font-size: 18px; padding: 0 4px; }
    .edit-field { display: block; margin-top: 10px; }
    .edit-field span { display: block; color: var(--sub); font-size: 13px; margin-bottom: 4px; }
    .edit-field select, .edit-field input { width: 100%; }
    .adj.vertex .adj-body { display: none; }
    .vx-handle { position: relative; width: 12px; height: 12px; margin: -6px 0 0 -6px; background: #fff; border: 2px solid #111; border-radius: 2px; cursor: move; box-shadow: 0 0 0 1px #ffd60a; }
    .vx-handle::after { content: ''; position: absolute; inset: -10px; } /* 指で押しやすいよう、見た目より広く反応させる */
    .adj-handle { width: 26px; height: 26px; margin: -13px 0 0 -13px; border-radius: 50%; background: #ffd60a; border: 3px solid #111;
      box-shadow: 0 0 0 2px #fff; display: flex; align-items: center; justify-content: center; font-size: 13px; color: #111; cursor: move; }
    .gps-rec .rec-auto { display: flex; align-items: center; gap: 6px; font-size: 13px; color: var(--sub); }
    @media (min-width: 900px) {
      body { display: grid; grid-template-columns: 1fr 380px; grid-template-rows: auto 1fr; }
      .ed-bar { grid-column: 1 / 3; }
      .map-wrap { grid-row: 2; }
      .ed-panel { grid-row: 2; max-height: none; border-top: none; border-left: 1px solid var(--line); }
    }
  </style>
</head>
<body>
  <div class="ed-bar">
    <select id="selCourse" aria-label="コース"></select>
    <select id="selNine" aria-label="コース（9ホール）"></select>
    <span class="hole-nav">
      <button class="hole-step" id="btnPrevHole" aria-label="前のホールへ">◀</button>
      <select id="selHole" aria-label="ホール番号"></select>
      <button class="hole-step primary" id="btnNextHole" aria-label="次のホールへ">次 ▶</button>
    </span>
    <label>Par <select id="selPar"><option value="">-</option><option>3</option><option>4</option><option>5</option><option>6</option></select></label>
    <label>HC <input type="number" id="inpHdcp" min="1" max="18"></label>
    <a href="index.html">プレー画面へ</a>
  </div>

  <div class="map-wrap">
    <div id="map"></div>
    <div class="map-tools">
      <button id="btnFit">ホール全体</button>
      <button id="btnMe">現在地へ</button>
    </div>
  </div>

  <div class="ed-panel">
    <div class="hz-opts">
      <label style="display:flex;align-items:center;gap:6px">登録するグリーン
        <select id="selEdGreen" aria-label="登録するグリーン"></select></label>
      <button id="btnGreenNames">呼び名を変更</button>
    </div>
    <div class="tools">
      <button data-mode="tee">ティー</button>
      <button data-mode="gcenter">グリーン中央</button>
      <button data-mode="gfront">グリーン前</button>
      <button data-mode="gback">グリーン奥</button>
      <button data-mode="gpoly">グリーンの形</button>
      <button data-mode="hpoint">ハザード（点）</button>
      <button data-mode="hpoly">ハザード（形）</button>
      <button data-mode="pickWater">OSMの池を選ぶ</button>
      <button data-mode="hline">OB等（線）</button>
      <button id="btnRec">GPSで記録</button>
    </div>
    <!-- 現地で GPS を使って形・線を記録する -->
    <div class="gps-rec hidden" id="gpsRec">
      <div class="hz-opts">
        <select id="recKind" aria-label="記録するもの">
          <option value="green">グリーンの形（縁を一周）</option>
          <option value="area">ハザードの形（バンカー・池の縁を一周）</option>
          <option value="line">線（OB・赤杭をたどる）</option>
        </select>
        <label class="rec-auto"><input type="checkbox" id="recAuto" checked> 歩くと自動で点を追加</label>
      </div>
      <div class="row" style="display:flex;gap:6px">
        <button class="primary" id="recStart">記録開始</button>
        <button id="recPoint">この地点を追加</button>
        <button id="recUndo">1点戻す</button>
      </div>
      <div class="row" style="display:flex;gap:6px;margin-top:6px">
        <button id="recDone">完了して登録</button>
        <button id="recCancel">やめる</button>
      </div>
      <p class="hint" id="recStatus">グリーン・バンカーは縁に沿って一周、OB・赤杭は杭に沿って歩きます。杭の前で「この地点を追加」を押してもかまいません。種類（バンカー・池・OB・赤杭など）と名前は、この下の欄で選びます。</p>
    </div>
    <div class="hz-opts">
      <select id="selTee" aria-label="ティーの種類"><option>レギュラー</option><option>バック</option><option>フロント</option><option>レディース</option></select>
      <select id="selHzType" aria-label="ハザードの種類"></select>
      <select id="selHzGreen" aria-label="どのグリーン用のハザードか"></select>
      <input type="text" id="inpHzLabel" placeholder="名前（例: 左FWバンカー）">
    </div>
    <div class="hint" id="hint">上のボタンを選んでから、地図をタップしてください。</div>
    <div class="row hidden" id="polyBar" style="display:flex;gap:6px">
      <button class="primary" id="btnPolyDone">形を確定</button>
      <button id="btnPolyUndo">1点戻す</button>
      <button id="btnPolyCancel">やめる</button>
    </div>
    <!-- 登録した内容の位置を、移動・回転して合わせる -->
    <div class="adj hidden" id="adjBar">
      <div class="adj-title" id="adjTitle"></div>
      <div class="adj-body">
        <div class="adj-pad">
          <span></span><button data-move="0,1" aria-label="北（上）へ動かす">↑</button><span></span>
          <button data-move="-1,0" aria-label="西（左）へ動かす">←</button><span class="adj-c">移動</span><button data-move="1,0" aria-label="東（右）へ動かす">→</button>
          <span></span><button data-move="0,-1" aria-label="南（下）へ動かす">↓</button><span></span>
        </div>
        <div class="adj-side">
          <label>幅 <select id="adjStep" aria-label="1回に動かす幅">
            <option value="0.5">0.5m</option><option value="1" selected>1m</option><option value="5">5m</option><option value="10">10m</option></select></label>
          <div class="adj-rot" id="adjRotBox">
            <button data-rot="-1" aria-label="左回りに回す">⟲</button>
            <button data-rot="1" aria-label="右回りに回す">⟳</button>
            <select id="adjRotStep" aria-label="1回に回す角度"><option value="1">1°</option><option value="5" selected>5°</option><option value="15">15°</option><option value="90">90°</option></select>
          </div>
        </div>
      </div>
      <p class="hint" id="adjInfo"></p>
      <div class="row" style="display:flex;gap:6px">
        <button class="primary" id="adjDone">確定</button>
        <button id="adjReset">最初に戻す</button>
        <button id="adjCancel">やめる</button>
      </div>
    </div>
    <div class="items-head">
      <button id="btnAdjHole">ホール全体を移動・回転</button>
    </div>
    <ul class="items" id="items"></ul>
    <div class="files">
      <button id="btnExport">ファイルに書き出す</button>
      <button id="btnImport">ファイルを読み込む</button>
      <input type="file" id="fileImport" accept=".json,application/json" class="hidden">
      <button id="btnDiscard">端末内の編集を捨てる</button>
    </div>
    <p class="hint" id="saveStatus" style="color:var(--sub)"></p>
  </div>

  <!-- 項目の修正画面（一覧の行、または地図の図形をタップすると開く） -->
  <div class="sheet hidden" id="editSheet">
    <div>
      <h2 id="editTitle"></h2>
      <p id="editInfo"></p>
      <div id="editFields"></div>
      <div class="row"><button id="editAdjust">位置を調整（移動・回転）</button></div>
      <div class="row"><button id="editVertex">点を1つずつ動かす</button></div>
      <div class="row">
        <button class="danger" id="editDelete">削除</button>
        <button class="primary" id="editClose">閉じる</button>
      </div>
    </div>
  </div>

  <script src="vendor/leaflet/leaflet.js"></script>
  <script type="module" src="js/editor.js"></script>
</body>
</html>
