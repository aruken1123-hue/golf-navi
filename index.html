<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#111111">
  <title>ゴルフナビ</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="vendor/leaflet/leaflet.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header>
    <button id="btnPrev" aria-label="前のホール">◀</button>
    <div class="hole" id="holeTitle" role="button" tabindex="0" title="ホール一覧">ゴルフナビ<small>コースを選んでください</small></div>
    <button id="btnNext" aria-label="次のホール">▶</button>
    <button id="btnMenu" aria-label="メニュー">☰</button>
  </header>

  <div class="map-wrap">
    <div id="map"></div>
    <div class="map-tools">
      <button id="btnFit">ホール全体</button>
      <button id="btnMe">現在地へ</button>
      <button id="btnManual" title="地図をタップした場所を現在地にする（自宅での確認用）">位置指定</button>
      <button id="btnPreview" title="ティーからの距離で表示する">下見</button>
    </div>
  </div>

  <section id="panel">
    <button class="panel-toggle" id="btnPanel" aria-expanded="true">▼ 地図を大きく</button>
    <div class="preview-note hidden" id="previewNote"></div>
    <div class="green-switch hidden" id="greenSwitch">
      <button id="btnGreen" aria-label="使うグリーンを切り替える"></button>
    </div>
    <div class="green-row" id="greenRow">
      <div><div class="lbl">前</div><div class="v" id="dFront">---</div></div>
      <div class="center"><div class="lbl">グリーン中央</div><div class="v" id="dCenter">---</div></div>
      <div><div class="lbl">奥</div><div class="v" id="dBack">---</div></div>
    </div>
    <div class="elev-row" id="elevRow">高低差 ---</div>
    <div class="note hidden" id="holeNote"></div>
    <ul class="hazards" id="hazardList"></ul>
    <div class="measure hidden" id="measureRow">
      <span id="measureText"></span>
      <button id="btnMeasureClear" aria-label="計測を消す">✕</button>
    </div>
    <div class="status">
      <span id="gpsStatus">GPS 待機中</span>
      <span id="wakeStatus"></span>
      <span id="verStatus"></span>
    </div>
  </section>

  <!-- ホール一覧（下見用） -->
  <div class="sheet hidden" id="holesSheet">
    <div>
      <h2>ホール一覧</h2>
      <ul class="hole-list" id="holeList"></ul>
      <div class="row"><button id="btnCloseHoles">閉じる</button></div>
    </div>
  </div>

  <!-- ラウンド設定 -->
  <div class="sheet hidden" id="setupSheet">
    <div>
      <h2>ラウンド設定</h2>
      <label for="selCourse">コース</label>
      <select id="selCourse"></select>
      <label for="selOut">前半</label>
      <select id="selOut"></select>
      <label for="selIn">後半</label>
      <select id="selIn"></select>
      <label for="selGreen" id="lblGreen">使うグリーン（2グリーンのホール）</label>
      <select id="selGreen"></select>
      <label class="check"><input type="checkbox" id="chkAutoHole"><span>GPS でホールを自動で切り替える<br><small>次のホールのティーに着くと、その表示に変わります</small></span></label>
      <div class="row">
        <button class="primary" id="btnStart">このコースで始める</button>
      </div>
      <div class="row">
        <button id="btnPrefetch">このコースの地図を端末に保存</button>
      </div>
      <p id="prefetchStatus">圏外でも地図と高低差が出るよう、コースに行く前にWi-Fiで保存しておくと安心です。</p>
      <div class="row">
        <button id="btnEditor">コース登録画面を開く</button>
        <button id="btnCloseSetup">閉じる</button>
      </div>
      <p id="dataStatus"></p>
    </div>
  </div>

  <script src="vendor/leaflet/leaflet.js"></script>
  <script src="vendor/leaflet-rotate/leaflet-rotate.js"></script>
  <script type="module" src="js/play.js"></script>
</body>
</html>
